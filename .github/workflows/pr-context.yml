name: PR Context (Reusable)

# ────────────────────────────────────────────────────────────────────────────
# Shared by all service repos. Resolves PR metadata from an issue_comment or
# pull_request event.
#
# Outputs:
#   branch     — PR head branch name
#   sha        — PR head commit SHA
#   pr_number  — PR number
#   repo       — repository name (e.g. "sdk", "ingestion")
# ────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    outputs:
      branch:
        description: "PR head branch name"
        value: ${{ jobs.resolve.outputs.branch }}
      sha:
        description: "PR head commit SHA"
        value: ${{ jobs.resolve.outputs.sha }}
      pr_number:
        description: "PR number"
        value: ${{ jobs.resolve.outputs.pr_number }}
      repo:
        description: "Repository name"
        value: ${{ jobs.resolve.outputs.repo }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
      sha: ${{ steps.pr.outputs.sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      repo: ${{ steps.pr.outputs.repo }}
    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber, branch, sha;

            if (context.eventName === 'pull_request') {
              prNumber = context.issue.number;
              branch = context.payload.pull_request.head.ref;
              sha = context.payload.pull_request.head.sha;
            } else if (context.eventName === 'issue_comment') {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              prNumber = context.issue.number;
              branch = pr.head.ref;
              sha = pr.head.sha;
            } else {
              throw new Error(`Unsupported event: ${context.eventName}`);
            }

            core.setOutput('pr_number', prNumber);
            core.setOutput('branch', branch);
            core.setOutput('sha', sha);
            core.setOutput('repo', context.repo.repo);

            console.log(`PR #${prNumber} | branch: ${branch} | repo: ${context.repo.repo}`);
