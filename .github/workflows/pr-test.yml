name: PR Test (Reusable)

on:
  workflow_call:
    inputs:
      app_type:
        description: "'runnable' or 'library'"
        required: true
        type: string
      app_name:
        description: "Short name for result comment"
        required: true
        type: string
      start_env:
        description: "Env vars for the app, one per line (KEY=VALUE)"
        required: false
        type: string
        default: ""
      integration_partner:
        description: "GitHub repo to clone+start for integration, or 'none'"
        required: false
        type: string
        default: "none"
      integration_env:
        description: "Env vars for integration partner, one per line (KEY=VALUE)"
        required: false
        type: string
        default: ""
      regression_partner:
        description: "Repo for library regression, or 'none'"
        required: false
        type: string
        default: "none"
      regression_env:
        description: "Env vars for regression partner, one per line (KEY=VALUE)"
        required: false
        type: string
        default: ""
      sdk_version_pattern:
        description: "Regex to extract SDK version from pyproject.toml"
        required: false
        type: string
        default: "trading-cz/sdk@[v\\d.]+"
    secrets:
      secret_env:
        description: "Extra env vars from secrets, one per line (KEY=VALUE)"
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      markers: ${{ steps.cmd.outputs.markers }}
      label: ${{ steps.cmd.outputs.label }}
      sha: ${{ steps.pr.outputs.sha }}
      ref: ${{ steps.pr.outputs.ref }}
    steps:
      - name: Check if PR comment
        id: check
        run: |
          if [ "${{ github.event.issue.pull_request }}" = "" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Parse command
        if: steps.check.outputs.skip != 'true'
        id: cmd
        run: |
          case "${{ github.event.comment.body }}" in
            "/test")              echo "markers=smoke or regression" >> $GITHUB_OUTPUT
                                  echo "label=all" >> $GITHUB_OUTPUT ;;
            "/smoke-test")        echo "markers=smoke" >> $GITHUB_OUTPUT
                                  echo "label=smoke" >> $GITHUB_OUTPUT ;;
            "/regression-test")   echo "markers=regression" >> $GITHUB_OUTPUT
                                  echo "label=regression" >> $GITHUB_OUTPUT ;;
            "/integration-test")  echo "markers=integration" >> $GITHUB_OUTPUT
                                  echo "label=integration" >> $GITHUB_OUTPUT ;;
            *)                    echo "markers=none" >> $GITHUB_OUTPUT
                                  echo "label=none" >> $GITHUB_OUTPUT ;;
          esac

      - name: Get PR details
        if: steps.check.outputs.skip != 'true' && steps.cmd.outputs.markers != 'none'
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.head.sha);
            core.setOutput('ref', pr.head.ref);

  test:
    needs: parse
    if: needs.parse.outputs.markers != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # ── Shared env (Kafka + secrets) ──────────────────────────────
      - name: Prepare shared env
        run: |
          cat > /tmp/shared_env << 'ENVEOF'
          ENVIRONMENT=tst
          KAFKA_BOOTSTRAP_SERVERS=localhost:9092
          ${{ secrets.secret_env || '' }}
          ENVEOF
          chmod 600 /tmp/shared_env

      # ── Install SDK (library: build wheel, runnable: git) ─────────
      - name: Build and install SDK (library)
        if: inputs.app_type == 'library'
        run: |
          pip install build
          python -m build
          WHEEL=$(ls dist/*.whl | head -1)
          pip install "$WHEEL"

      - name: Install SDK from pyproject.toml (runnable)
        if: inputs.app_type == 'runnable'
        run: |
          SDK_VERSION=$(grep -oP '${{ inputs.sdk_version_pattern }}' pyproject.toml | grep -oP '[v\d.]+$' | head -1)
          if [ -n "$SDK_VERSION" ]; then
            pip install "trading-sdk @ git+https://github.com/trading-cz/sdk@${SDK_VERSION}"
          else
            pip install "trading-sdk @ git+https://github.com/trading-cz/sdk@main"
          fi

      - name: Install app (runnable)
        if: inputs.app_type == 'runnable'
        run: pip install -e ".[dev]"

      # ── Testing repo ──────────────────────────────────────────────
      - name: Resolve testing branch
        id: testing
        run: |
          BRANCH="${{ needs.parse.outputs.ref }}"
          if git ls-remote --heads https://github.com/trading-cz/testing "$BRANCH" | grep -q "$BRANCH"; then
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          else
            echo "branch=main" >> $GITHUB_OUTPUT
          fi

      - name: Checkout testing repo
        uses: actions/checkout@v4
        with:
          repository: trading-cz/testing
          path: ../testing
          ref: ${{ steps.testing.outputs.branch }}

      - name: Install testing deps
        run: cd ../testing && pip install -e .

      # ── Kafka ─────────────────────────────────────────────────────
      - name: Start Kafka
        run: |
          cd ../testing
          docker compose up -d kafka
          for i in $(seq 1 30); do
            if docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka ready"; break
            fi
            sleep 2
          done

      # ── _start_app helper ─────────────────────────────────────────
      - name: Define _start_app helper
        run: |
          cat > /tmp/_start_app.sh << 'SCRIPT'
          #!/bin/bash
          REPO="$1"; EXTRA_ENV="${2:-/dev/null}"
          git clone --depth 1 "https://github.com/trading-cz/${REPO}" "../${REPO}"
          cd "../${REPO}"
          pip install -e .
          set -a
          source /tmp/shared_env
          [ -f "$EXTRA_ENV" ] && source "$EXTRA_ENV"
          set +a
          python main.py &
          sleep 5
          SCRIPT
          chmod +x /tmp/_start_app.sh

      # ── Start apps ────────────────────────────────────────────────
      - name: Start app under test
        if: inputs.app_type == 'runnable'
        run: |
          echo "${{ inputs.start_env }}" > /tmp/app_env
          set -a; source /tmp/shared_env; source /tmp/app_env; set +a
          python main.py &
          sleep 5

      - name: Start regression partner (library)
        if: |
          inputs.app_type == 'library' && inputs.regression_partner != 'none' &&
          (needs.parse.outputs.label == 'regression' || needs.parse.outputs.label == 'integration' || needs.parse.outputs.label == 'all')
        run: |
          echo "${{ inputs.regression_env }}" > /tmp/regression_env
          /tmp/_start_app.sh "${{ inputs.regression_partner }}" /tmp/regression_env

      - name: Start integration partner
        if: |
          inputs.integration_partner != 'none' &&
          (needs.parse.outputs.label == 'integration' || needs.parse.outputs.label == 'all')
        run: |
          echo "${{ inputs.integration_env }}" > /tmp/integration_env
          /tmp/_start_app.sh "${{ inputs.integration_partner }}" /tmp/integration_env

      # ── Run tests ─────────────────────────────────────────────────
      - name: Run tests
        id: pytest
        run: |
          cd ../testing
          set -a; source /tmp/shared_env; set +a
          python -m pytest tests/ -v -m "${{ needs.parse.outputs.markers }}" \
            --tb=short --junitxml=test-results.xml
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # ── Report ────────────────────────────────────────────────────
      - name: Post results comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const exitCode = '${{ steps.pytest.outputs.exit_code }}';
            const status = exitCode === '0' ? '✅ All tests passed' : '❌ Tests failed';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🧪 Test Results\n\n**App**: ${{ inputs.app_name }}\n**Trigger**: \`${{ github.event.comment.body }}\`\n**Markers**: \`${{ needs.parse.outputs.markers }}\`\n\n${status}`,
            });

      # ── Cleanup ───────────────────────────────────────────────────
      - name: Cleanup
        if: always()
        run: |
          pkill -f "python main.py" 2>/dev/null || true
          cd ../testing && docker compose down -v 2>/dev/null || true
