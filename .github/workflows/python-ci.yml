name: Python CI (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        description: 'Python version to use (e.g., 3.12)'
        default: '3.12'
      test-dir:
        type: string
        description: 'Directory containing tests (e.g., tests)'
        default: 'tests'
      pip-audit-ignore:
        type: string
        description: 'Space-separated vulnerability IDs to ignore (e.g., PYSEC-2026-161)'
        default: ''

permissions:
  contents: read
  pull-requests: write

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install pipdeptree pip-audit

      - name: Check for dependency conflicts
        run: python -m pip check

      - name: Check dependency tree integrity
        run: pipdeptree --warn fail

      - name: Audit for known vulnerabilities
        env:
          PIP_AUDIT_IGNORE: ${{ inputs.pip-audit-ignore }}
        run: |
          PIP_AUDIT_ARGS="--desc on"
          if [ -n "$PIP_AUDIT_IGNORE" ]; then
            for VULN_ID in $PIP_AUDIT_IGNORE; do
              PIP_AUDIT_ARGS="$PIP_AUDIT_ARGS --ignore-vuln $VULN_ID"
            done
          fi
          python -m pip_audit $PIP_AUDIT_ARGS

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install coverage pytest-cov

      - name: Run tests with coverage
        run: |
          pytest ${{ inputs.test-dir }} -v \
            --cov=tradingcz \
            --cov-report=term \
            --cov-report=html

      - name: Upload coverage report (HTML)
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: htmlcov/
          compression-level: 0

      - name: Generate coverage markdown summary
        run: coverage report --format=markdown > coverage.md

      - name: Display coverage summary in GitHub job
        run: cat coverage.md >> $GITHUB_STEP_SUMMARY

      - name: Comment coverage summary on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: coverage.md
          comment-tag: coverage
          mode: recreate
          reactions: eyes
