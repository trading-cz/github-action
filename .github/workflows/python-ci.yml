name: Python CI (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        description: 'Python version to use (e.g., 3.12)'
        default: '3.12'
      test-dir:
        type: string
        description: 'Directory containing tests (e.g., tests)'
        default: 'tests'
      install-project:
        type: boolean
        description: 'Install the repository package and its development dependencies'
        default: true
      coverage-source:
        type: string
        description: 'Package to measure for coverage; empty disables coverage reporting'
        default: 'tradingcz'

permissions:
  contents: read
  pull-requests: write

jobs:
  dependencies:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ inputs.install-project }}" == "true" ]]; then
            pip install .[dev]
          fi
          pip install pipdeptree pip-audit

      - name: Check for dependency conflicts
        run: python -m pip check

      - name: Check dependency tree integrity
        run: pipdeptree --warn fail

      - name: Audit for known vulnerabilities
        run: python -m pip_audit --desc on

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ inputs.install-project }}" == "true" ]]; then
            pip install .[dev]
          fi
          pip install coverage pytest-cov

      - name: Run tests with coverage
        run: |
          if [[ -n "${{ inputs.coverage-source }}" ]]; then
            pytest "${{ inputs.test-dir }}" -v \
              --cov="${{ inputs.coverage-source }}" \
              --cov-report=term \
              --cov-report=html
          else
            pytest "${{ inputs.test-dir }}" -v
          fi

      - name: Upload coverage report (HTML)
        if: ${{ inputs.coverage-source != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: htmlcov/
          compression-level: 0

      - name: Generate coverage markdown summary
        if: ${{ inputs.coverage-source != '' }}
        run: coverage report --format=markdown > coverage.md

      - name: Display coverage summary in GitHub job
        if: ${{ inputs.coverage-source != '' }}
        run: cat coverage.md >> $GITHUB_STEP_SUMMARY

      - name: Comment coverage summary on PR
        if: ${{ inputs.coverage-source != '' && github.event_name == 'pull_request' }}
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: coverage.md
          comment-tag: coverage
          mode: recreate
          reactions: eyes
